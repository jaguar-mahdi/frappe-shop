name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jaguar-mahdi/frappe-shop
  # frappe_docker v4.2.0, pinned to its commit (images/layered/Containerfile)
  FRAPPE_DOCKER_REF: 61d35da827ebc04d01b64c9e78385597ccebc9d8
  FRAPPE_BRANCH: version-16

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://github.com/jaguar-mahdi/frappe-shop/pkgs/container/frappe-shop
    timeout-minutes: 90

    steps:
      - name: Write apps.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cat > apps.json <<EOF
          [
            { "url": "https://github.com/frappe/payments", "branch": "${FRAPPE_BRANCH}" },
            { "url": "https://github.com/frappe/erpnext", "branch": "${FRAPPE_BRANCH}" },
            { "url": "https://github.com/frappe/webshop", "branch": "${FRAPPE_BRANCH}" },
            { "url": "https://github.com/${GITHUB_REPOSITORY}", "branch": "${RELEASE_TAG}" }
          ]
          EOF
          python3 -m json.tool apps.json

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: https://github.com/frappe/frappe_docker.git#${{ env.FRAPPE_DOCKER_REF }}
          file: images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ github.sha }}
          secret-files: |
            apps_json=./apps.json
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
